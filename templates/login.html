<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FixBah</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="auth-page">

    <!-- Navigation Bar -->
   <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
                <img
                    src="{{ url_for('static', filename='images/fixbah-logo.png') }}"
                    alt="FixBah logo"
                    class="fixbah-logo"
                >
            </a>

            <a href="{{ url_for('register') }}" class="btn btn-primary-brand">
                Create Account
            </a>
        </div>
   
    </nav>

    <main class="auth-container">

        <div class="auth-card">

          
            <h1 class="auth-title">Welcome Back!</h1>

            <p class="auth-subtitle">
                Sign in to manage your home services.
            </p>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">

                <div class="mb-3">
                    <label for="identifier" class="form-label">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="identifier"
                        name="identifier"
                        placeholder="Enter your username or email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit"
                        class="btn btn-primary-brand w-100 mt-2">
                    Login
                </button>

            </form>

            <div class="auth-footer">
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Register here
                </a>
            </div>

            <div class="text-center mt-3">
                <a href="{{ url_for('home') }}" class="back-home">
                    ← Back to Home
                </a>
            </div>

        </div>

    </main>

</body>
</html>
