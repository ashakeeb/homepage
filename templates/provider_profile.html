<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Business Profile - FixBH</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">FixBH</a>

            <a href="{{ url_for('provider_dashboard') }}"
               class="btn btn-light btn-sm">
                Dashboard
            </a>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h2 class="mb-4">Business Profile</h2>

                        <p class="text-muted">
                            Tell customers about your business and services.
                        </p>

                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        {% if success %}
                            <div class="alert alert-success">
                                {{ success }}
                            </div>
                        {% endif %}

                        <form method="POST">

                            <div class="mb-3">
                                <label for="business_name"
                                       class="form-label">
                                    Business Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="business_name"
                                    name="business_name"
                                    value="{{ profile.business_name if profile else '' }}"
                                    maxlength="100"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    name="phone"
                                    value="{{ profile.phone if profile else '' }}"
                                    maxlength="25"
                                    placeholder="+973 1234 5678"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="description"
                                       class="form-label">
                                    Business Description
                                </label>

                                <textarea
                                    class="form-control"
                                    id="description"
                                    name="description"
                                    rows="4"
                                    maxlength="1000"
                                    placeholder="Describe your experience and services..."
                                >{{ profile.description if profile else '' }}</textarea>
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Save Business Profile
                            </button>

                        </form>

                        {% if profile %}
                            <p class="mt-3 mb-0">
                                Verification status:
                                {% if profile.verified %}
                                    <span class="text-success">
                                        Verified
                                    </span>
                                {% else %}
                                    <span class="text-warning">
                                        Not yet verified
                                    </span>
                                {% endif %}
                            </p>
                        {% endif %}

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
