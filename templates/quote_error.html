<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quote Already Processed | FixBah</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="booking-page">

    <!-- Navigation -->
    <nav class="booking-navbar">
        <div class="container d-flex justify-content-between align-items-center">

            <a class="booking-brand" href="/">
                Fix<span class="brand-highlight">Bah</span>
            </a>

            <a href="{{ url_for('logout') }}"
               class="booking-logout-btn">
                Logout
            </a>

        </div>
    </nav>

    <!-- Error Message -->
    <main class="container py-5">

        <div class="card shadow-sm border-0 mx-auto"
             style="max-width: 650px; border-radius: 16px;">

            <div class="card-body text-center p-4 p-md-5">

                <div class="mb-3"
                     style="font-size: 55px; color: #18A7A1;">
                    ✓
                </div>

                <h1 class="h3 fw-bold mb-3"
                    style="color: #12304A;">
                    Quote Already Processed
                </h1>

                <p class="text-secondary mb-4">
                    This quote has already been accepted or processed,
                    so it cannot be booked again.
                </p>

                <p class="text-secondary mb-4">
                    You can check your service requests to see the current
                    status of your booking or explore other available quotes.
                </p>

                <div class="d-flex flex-column flex-sm-row
                            justify-content-center gap-3">

                    <a href="{{ url_for('my_requests') }}"
                       class="btn btn-primary-brand">
                        View My Requests
                    </a>

                    <a href="{{ url_for('dashboard') }}"
                        class="btn btn-primary-brand">
                        Return to Dashboard
                    </a>

                </div>

            </div>
        </div>

    </main>

</body>
</html>
