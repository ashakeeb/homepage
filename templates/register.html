<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | FixBah</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="auth-page">

   <nav class="navbar navbar-dark">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
                <img
                    src="{{ url_for('static', filename='images/fixbah-logo.png') }}"
                    alt="FixBah logo"
                    class="fixbah-logo"
                >
            </a>

            <a href="{{ url_for('login') }}" class="btn btn-primary-brand">
                Login
            </a>

        </div>
    </nav>

    <main class="auth-container">

        <div class="auth-card">
            
            <h1 class="auth-title">Create Your Account</h1>

            <p class="auth-subtitle">
                Your Home. Our Responsibility.
            </p>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="20"
                        pattern="[a-zA-Z0-9_]+"
                        autocomplete="username"
                        required
                    >

                    <small class="text-muted">
                        Use 3–20 letters, numbers, or underscores.
                    </small>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <small class="text-muted">
                        At least 8 characters, including uppercase,
                        lowercase, and a number.
                    </small>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label">
                        Account Type
                    </label>

                    <select
                        class="form-select"
                        id="role"
                        name="role"
                        required
                    >
                        <option value="customer" selected>
                            Customer — I need home services
                        </option>

                        <option value="provider">
                            Service Provider — I offer services
                        </option>
                    </select>
                </div>

                <button type="submit"
                        class="btn btn-primary-brand w-100">
                    Create Account
                </button>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Login here
                </a>
            </div>

            <div class="text-center mt-3">
                <a href="{{ url_for('home') }}" class="back-home">
                    ← Back to Home
                </a>
            </div>

        </div>

    </main>

</body>
</html>
