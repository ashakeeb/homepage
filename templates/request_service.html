<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Request a Service - FixBH</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">FixBH</a>

            <a href="{{ url_for('dashboard') }}"
               class="btn btn-light btn-sm">
                Dashboard
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h2 class="mb-4">Request a Service</h2>

                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form method="POST">

                            <div class="mb-3">
                                <label for="category" class="form-label">
                                    Select Service
                                </label>

                                <select
                                    class="form-select"
                                    id="category"
                                    name="category_id"
                                    required
                                >
                                    <option value="">Choose a service</option>

                                    {% for category in categories %}
                                        <option value="{{ category.id }}">
                                            {{ category.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    Describe the Problem
                                </label>

                                <textarea
                                    class="form-control"
                                    id="description"
                                    name="description"
                                    rows="4"
                                    minlength="10"
                                    maxlength="1000"
                                    placeholder="Explain what needs to be repaired..."
                                    required
                                ></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="location" class="form-label">
                                    Your Location in Bahrain
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="location"
                                    name="location"
                                    maxlength="200"
                                    placeholder="e.g. Riffa, Block 901"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Submit Request
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
