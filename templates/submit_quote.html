<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Submit a Quote - FixBH</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FixBH</a>

        <a href="{{ url_for('logout') }}" class="btn btn-light btn-sm">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-5 mb-5">

    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-body p-4">

            <h2 class="mb-4">Submit a Quote</h2>

            <h5>Service Request Details</h5>

            <p>
                <strong>Service:</strong>
                {{ service_request.category_name }}
            </p>

            <p>
                <strong>Customer's Description:</strong><br>
                {{ service_request.description }}
            </p>

            <p>
                <strong>Location:</strong>
                {{ service_request.location }}
            </p>

            {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
            {% endif %}

            <hr>

            <form method="POST">

                <div class="mb-3">
                    <label for="price" class="form-label">
                        Your Price (BHD)
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="price"
                        name="price"
                        min="0"
                        step="0.001"
                        required
                    >

                    <div class="form-text">
                        Enter your price in Bahraini dinars.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Quote Details
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        name="description"
                        rows="4"
                        maxlength="1000"
                        placeholder="Explain what your price includes..."
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit Quote
                </button>

                <a
                    href="{{ url_for('provider_requests') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
